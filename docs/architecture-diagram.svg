<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%" style="background-color: #0f172a; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="grad-sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="grad-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="grad-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Title & Subtitle -->
  <text x="500" y="42" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="800" letter-spacing="0.5">DermAI System Architecture &amp; Data Pipeline</text>
  <text x="500" y="66" text-anchor="middle" fill="#94a3b8" font-size="13">End-to-End Clinical Screening, ResNet50 Transfer Learning, Grad-CAM, &amp; RAG LLM Microservice</text>

  <!-- Flow Lines / Connections -->
  <g stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,6" opacity="0.6">
    <path d="M 230 190 L 310 190" />
    <path d="M 470 190 L 530 190" />
    <path d="M 690 190 L 760 190" />
    <path d="M 390 250 L 390 340" />
    <path d="M 610 250 L 610 340" />
    <path d="M 610 440 L 610 510" />
    <path d="M 390 440 L 390 510" />
    <path d="M 230 555 L 310 555" />
    <path d="M 470 555 L 530 555" />
    <path d="M 690 555 L 760 555" />
  </g>

  <!-- SECTION 1: PRESENTATION LAYER -->
  <g transform="translate(40, 110)" filter="url(#shadow)">
    <rect width="190" height="160" rx="12" fill="url(#grad-card)" stroke="#0284c7" stroke-width="1.5"/>
    <rect width="190" height="36" rx="12" fill="url(#grad-sky)"/>
    <text x="95" y="24" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">Presentation Layer</text>
    
    <text x="16" y="60" fill="#38bdf8" font-size="11" font-weight="700">• Vite React 19 SPA</text>
    <text x="28" y="76" fill="#cbd5e1" font-size="10">Port 8080 (Tailwind + Lucide)</text>
    
    <text x="16" y="100" fill="#38bdf8" font-size="11" font-weight="700">• Jinja2 Web UI</text>
    <text x="28" y="116" fill="#cbd5e1" font-size="10">Port 5001 (SaaS Light Theme)</text>
    
    <text x="16" y="140" fill="#38bdf8" font-size="11" font-weight="700">• Drag-and-Drop Dropzone</text>
  </g>

  <!-- SECTION 2: API INGESTION & BACKEND -->
  <g transform="translate(280, 110)" filter="url(#shadow)">
    <rect width="190" height="160" rx="12" fill="url(#grad-card)" stroke="#38bdf8" stroke-width="1.5"/>
    <rect width="190" height="36" rx="12" fill="url(#grad-sky)"/>
    <text x="95" y="24" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">API Gateway &amp; Router</text>
    
    <text x="16" y="60" fill="#f1f5f9" font-size="11" font-weight="700">Flask REST API (Port 5001)</text>
    <text x="28" y="76" fill="#94a3b8" font-size="10">POST /predict (Image Ingestion)</text>
    <text x="28" y="92" fill="#94a3b8" font-size="10">GET /report/&lt;id&gt; (ReportLab PDF)</text>
    
    <text x="16" y="118" fill="#f1f5f9" font-size="11" font-weight="700">Express Node API (Port 5000)</text>
    <text x="28" y="134" fill="#94a3b8" font-size="10">POST /api/insights/generate</text>
    <text x="28" y="150" fill="#94a3b8" font-size="10">User &amp; Auth Controller</text>
  </g>

  <!-- SECTION 3: COMPUTER VISION & DEEP LEARNING -->
  <g transform="translate(520, 110)" filter="url(#shadow)">
    <rect width="190" height="160" rx="12" fill="url(#grad-card)" stroke="#0d9488" stroke-width="1.5"/>
    <rect width="190" height="36" rx="12" fill="url(#grad-teal)"/>
    <text x="95" y="24" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">ResNet50 Deep Learning</text>
    
    <text x="16" y="60" fill="#2dd4bf" font-size="11" font-weight="700">• Preprocessing Normalization</text>
    <text x="28" y="74" fill="#cbd5e1" font-size="10">224x224 RGB, Zero-Mean BGR</text>
    
    <text x="16" y="96" fill="#2dd4bf" font-size="11" font-weight="700">• Two-Stage Fine-Tuning</text>
    <text x="28" y="110" fill="#cbd5e1" font-size="10">Stage 1: Head | Stage 2: Top 40</text>
    
    <text x="16" y="132" fill="#2dd4bf" font-size="11" font-weight="700">• Output Logits z</text>
    <text x="28" y="146" fill="#cbd5e1" font-size="10">Raw Probability p_raw</text>
  </g>

  <!-- SECTION 4: CALIBRATION & EXPLAINABILITY -->
  <g transform="translate(760, 110)" filter="url(#shadow)">
    <rect width="190" height="160" rx="12" fill="url(#grad-card)" stroke="#d97706" stroke-width="1.5"/>
    <rect width="190" height="36" rx="12" fill="url(#grad-amber)"/>
    <text x="95" y="24" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">Calibration &amp; Grad-CAM</text>
    
    <text x="16" y="60" fill="#fbbf24" font-size="11" font-weight="700">• Temperature Scaling</text>
    <text x="28" y="74" fill="#cbd5e1" font-size="10">T = 0.5000 (ECE: 0.1533 -&gt; 0.0488)</text>
    
    <text x="16" y="96" fill="#fbbf24" font-size="11" font-weight="700">• Grad-CAM Heatmap</text>
    <text x="28" y="110" fill="#cbd5e1" font-size="10">Layer: conv5_block3_out</text>
    
    <text x="16" y="132" fill="#fbbf24" font-size="11" font-weight="700">• Piecewise Severity Risk</text>
    <text x="28" y="146" fill="#cbd5e1" font-size="10">LOW &lt; 0.50 &lt;= MOD &lt; 0.75 &lt;= SEV</text>
  </g>

  <!-- SECTION 5: RAG & KNOWLEDGE RETRIEVAL -->
  <g transform="translate(520, 310)" filter="url(#shadow)">
    <rect width="190" height="150" rx="12" fill="url(#grad-card)" stroke="#7c3aed" stroke-width="1.5"/>
    <rect width="190" height="36" rx="12" fill="url(#grad-purple)"/>
    <text x="95" y="24" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">Local RAG Context Engine</text>
    
    <text x="16" y="60" fill="#a78bfa" font-size="11" font-weight="700">• Knowledge Base File</text>
    <text x="28" y="74" fill="#cbd5e1" font-size="10">backend/knowledge/skin_diseases.md</text>
    
    <text x="16" y="96" fill="#a78bfa" font-size="11" font-weight="700">• Chunking &amp; Keyword Match</text>
    <text x="28" y="110" fill="#cbd5e1" font-size="10">Header-based split ('## ')</text>
    
    <text x="16" y="132" fill="#a78bfa" font-size="11" font-weight="700">• Prompt Synthesizer</text>
  </g>

  <!-- SECTION 6: NVIDIA NIM LLM MICROSERVICE -->
  <g transform="translate(760, 310)" filter="url(#shadow)">
    <rect width="190" height="150" rx="12" fill="url(#grad-card)" stroke="#7c3aed" stroke-width="1.5"/>
    <rect width="190" height="36" rx="12" fill="url(#grad-purple)"/>
    <text x="95" y="24" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">NVIDIA NIM Microservice</text>
    
    <text x="16" y="60" fill="#c4b5fd" font-size="11" font-weight="700">• Model Endpoint</text>
    <text x="28" y="74" fill="#cbd5e1" font-size="10">meta/llama-3.1-70b-instruct</text>
    
    <text x="16" y="96" fill="#c4b5fd" font-size="11" font-weight="700">• Base URL API</text>
    <text x="28" y="110" fill="#cbd5e1" font-size="10">integrate.api.nvidia.com/v1</text>
    
    <text x="16" y="132" fill="#c4b5fd" font-size="11" font-weight="700">• Clinical Insight Report</text>
  </g>

  <!-- SECTION 7: DATABASE & RECORD LOGGING -->
  <g transform="translate(280, 480)" filter="url(#shadow)">
    <rect width="190" height="130" rx="12" fill="url(#grad-card)" stroke="#0284c7" stroke-width="1.5"/>
    <rect width="190" height="32" rx="12" fill="url(#grad-sky)"/>
    <text x="95" y="21" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">SQLite Database Storage</text>
    
    <text x="16" y="52" fill="#38bdf8" font-size="11" font-weight="700">• predictions Table</text>
    <text x="28" y="66" fill="#cbd5e1" font-size="10">patient_name, doctor_name, prob</text>
    
    <text x="16" y="86" fill="#38bdf8" font-size="11" font-weight="700">• users Table</text>
    <text x="28" y="100" fill="#cbd5e1" font-size="10">Scrypt password hashes, sessions</text>
  </g>

  <!-- SECTION 8: CLINICAL PDF ENGINE -->
  <g transform="translate(520, 480)" filter="url(#shadow)">
    <rect width="190" height="130" rx="12" fill="url(#grad-card)" stroke="#0d9488" stroke-width="1.5"/>
    <rect width="190" height="32" rx="12" fill="url(#grad-teal)"/>
    <text x="95" y="21" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">ReportLab PDF Engine</text>
    
    <text x="16" y="52" fill="#2dd4bf" font-size="11" font-weight="700">• PDF Generator</text>
    <text x="28" y="66" fill="#cbd5e1" font-size="10">create_pdf_report(scan, user)</text>
    
    <text x="16" y="86" fill="#2dd4bf" font-size="11" font-weight="700">• Side-by-Side Visuals</text>
    <text x="28" y="100" fill="#cbd5e1" font-size="10">Original Photo vs Grad-CAM</text>
  </g>

  <!-- SECTION 9: DOCTOR & PATIENT VIEWS -->
  <g transform="translate(760, 480)" filter="url(#shadow)">
    <rect width="190" height="130" rx="12" fill="url(#grad-card)" stroke="#d97706" stroke-width="1.5"/>
    <rect width="190" height="32" rx="12" fill="url(#grad-amber)"/>
    <text x="95" y="21" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">Filtered History Views</text>
    
    <text x="16" y="52" fill="#fbbf24" font-size="11" font-weight="700">• /doctor/&lt;doctor_name&gt;</text>
    <text x="28" y="66" fill="#cbd5e1" font-size="10">Full clinical stats &amp; metrics</text>
    
    <text x="16" y="86" fill="#fbbf24" font-size="11" font-weight="700">• /patient/&lt;patient_name&gt;</text>
    <text x="28" y="100" fill="#cbd5e1" font-size="10">Simplified patient summary</text>
  </g>
</svg>
