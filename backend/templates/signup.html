{% extends "base.html" %}

{% block title %}Create Account - DermAI Medical AI{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-6 col-lg-5">
        <div class="card card-saas p-4 p-md-5 border-0 shadow-lg bg-white">
            <div class="text-center mb-4">
                <div class="brand-icon mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.4rem;">
                    <i class="bi bi-person-plus"></i>
                </div>
                <h3 class="fw-bold text-dark mb-1">Get Started with DermAI</h3>
                <p class="text-muted small">Create your account for secure AI skin screening</p>
            </div>

            <form method="POST" action="{{ url_for('signup') }}">
                <div class="mb-3">
                    <label for="name" class="form-label text-dark small fw-semibold">Full Name</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control bg-light border-start-0 text-dark" id="name" name="name" required placeholder="Dr. Jane Smith">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label text-dark small fw-semibold">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control bg-light border-start-0 text-dark" id="email" name="email" required placeholder="name@example.com">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label text-dark small fw-semibold">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control bg-light border-start-0 text-dark" id="password" name="password" required minlength="6" placeholder="At least 6 characters">
                    </div>
                </div>

                <div class="mb-4">
                    <label for="confirm_password" class="form-label text-dark small fw-semibold">Confirm Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-shield-check"></i></span>
                        <input type="password" class="form-control bg-light border-start-0 text-dark" id="confirm_password" name="confirm_password" required placeholder="Re-enter password">
                    </div>
                </div>

                <button type="submit" class="btn btn-saas-primary w-100 py-2.5 mb-3 fw-semibold">
                    Create Account <i class="bi bi-check-circle ms-1"></i>
                </button>
            </form>

            <div class="text-center mt-3 pt-3 border-top">
                <p class="text-muted small mb-0">Already have an account? <a href="{{ url_for('login') }}" class="text-primary text-decoration-none fw-bold">Sign In</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
